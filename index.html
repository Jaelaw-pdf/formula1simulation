<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="F1 중계 화면 스타일 시즌 디렉터 시뮬레이션">
<title>PitWall 디렉터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: broadcast-graphics dark UI wrapped in a repository shell — repo header + tabs, live race = timing tower left, pit wall right */
:root{
  --bg:#08090b; --panel:#121418; --panel-2:#1a1d23; --line:#262a32; --line-2:#343944;
  --fg:#f4f5f7; --muted:#9097a3; --dim:#5f6672;
  --team:#2f6fed; --team-ink:#fff;
  --f1red:#e10600; --good:#2ecc71; --bad:#ff4d4d; --warn:#ffcf33;
  --t-s:#e8002d; --t-m:#ffd12e; --t-h:#f0f0f0; --t-i:#43b02a; --t-w:#0067ad;
  --flag-sc:#ffcf33; --flag-red:#e10600;
  --f-disp:"Titillium Web","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Titillium Web",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--team);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#000;border-bottom:1px solid var(--line);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:52px}
.mark{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:900;font-size:19px;letter-spacing:.02em;text-transform:lowercase}
.mark svg{display:block}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--f-disp);font-size:16px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs b{color:var(--fg);font-weight:700}
.topbar .sp{flex:1}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--team);color:var(--team-ink);font-weight:700;font-size:12px;flex:none}

/* repo header + tabs */
.repo{padding-top:20px}
.repo-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.repo-h h1{margin:0;font-family:var(--f-disp);font-weight:600;font-size:22px;color:var(--muted)}
.repo-h h1 b{color:var(--fg);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--muted);font-family:var(--f-disp);font-weight:600}
.pill.live{border-color:var(--f1red);color:#fff;background:rgba(225,6,0,.18)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--f1red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;display:flex;align-items:center;gap:7px;color:var(--muted);font-family:var(--f-disp);font-weight:600;font-size:15px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--team)}
.tabs .cnt{background:var(--panel-2);border-radius:999px;padding:0 7px;font-size:12px;color:var(--fg)}
.tabs svg{width:16px;height:16px}
main{padding-top:20px}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card>header .sp{flex:1}
.card .body{padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:4px;padding:6px 12px;font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.02em}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--team);border-color:var(--team);color:var(--team-ink)}
.btn.red{background:var(--f1red);border-color:var(--f1red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:10px 18px;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:4px 10px;font-family:var(--f-disp);font-weight:600;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--fg);color:#000}
.lbl{font-family:var(--f-disp);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.row-flex{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
table{border-collapse:collapse;width:100%}
.tscroll{overflow-x:auto}
th{font-family:var(--f-disp);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.me td{background:color-mix(in srgb,var(--team) 16%,transparent)}
.stripe{display:inline-block;width:4px;height:16px;border-radius:1px;vertical-align:-3px;margin-right:8px}

/* tyres */
.tyre{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:3px solid var(--c);font-family:var(--f-disp);font-weight:900;font-size:11px;line-height:1;color:var(--fg);flex:none}
.tyre[data-c=S]{--c:var(--t-s)}.tyre[data-c=M]{--c:var(--t-m)}.tyre[data-c=H]{--c:var(--t-h)}.tyre[data-c=I]{--c:var(--t-i)}.tyre[data-c=W]{--c:var(--t-w)}
.tyre.lg{width:30px;height:30px;font-size:13px;border-width:4px}

/* setup */
.setup{max-width:780px;margin:0 auto}
.setup h2{font-size:28px;font-weight:700}
.field{display:grid;gap:6px;margin-top:18px}
.field input[type=text],.field input[type=number],.field select{background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;color:var(--fg);font:inherit;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:4px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px}
.opt b{display:block;font-family:var(--f-disp);font-size:15px}
.opt small{color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--team);background:color-mix(in srgb,var(--team) 14%,var(--panel))}
.alloc{display:grid;gap:8px}
.alloc .a{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--team)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:28px;height:28px;border:1px solid var(--line-2);background:var(--panel-2);border-radius:4px}
.pool{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:4px}
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 6px}
.cand{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cc,#888);border-radius:4px;padding:10px;display:grid;gap:6px;min-width:0}
.cand[data-cat="F2"]{--cc:#3aa0ff}.cand[data-cat="F3"]{--cc:#f5a623}.cand[data-cat="리저브"]{--cc:#2ecc71}
.cand .cn{font-family:var(--f-disp);font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.cand .cs{display:flex;gap:10px;font-size:12px;color:var(--muted)}.cand .cs b{color:var(--fg)}
.cand .cb{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cand .cb .btn{padding:6px 4px;font-size:12px;justify-content:center}
.cand .cb .btn[aria-pressed="true"]{border-color:var(--team);background:color-mix(in srgb,var(--team) 22%,var(--panel))}
.ctag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:3px;background:var(--panel-2);border:1px solid var(--line-2)}
.dcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--team);border-radius:4px;padding:12px;display:grid;gap:8px;min-width:0}
.dcard .two{gap:8px}
.dcard input,.dcard select{background:var(--bg);border:1px solid var(--line-2);border-radius:4px;padding:6px 8px;color:var(--fg);font:inherit;width:100%;min-width:0}
.warn{color:var(--warn);font-size:12px}
.preview{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:4px;background:#000;display:flex;flex-wrap:wrap;gap:18px}
.preview div{display:grid}
.preview b{font-family:var(--f-disp);font-size:24px;line-height:1.1}

/* overview */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.latest{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:13px;min-width:0}
.latest .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .f{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
.files .f:last-child{border-bottom:0}
.files .f .n{font-family:var(--f-mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .f .c{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readme{margin-top:16px}
.readme .body{display:grid;gap:16px}
.readme h2{font-size:30px;font-weight:900;letter-spacing:.01em}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;font-family:var(--f-disp);font-weight:700;font-size:12px;border-radius:3px;overflow:hidden}
.badge span{padding:2px 7px;background:#2b2f37}
.badge span+span{background:var(--team);color:var(--team-ink)}
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-radius:4px;background:#000;border:1px solid var(--line-2);border-left:6px solid var(--f1red)}
.next .rd{font-family:var(--f-disp);font-weight:900;font-size:13px;color:var(--f1red);letter-spacing:.1em}
.next h3{font-size:24px;font-weight:900;text-transform:uppercase}
.side{display:grid;gap:20px;align-content:start}
.side h3{font-size:15px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.contrib{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:10px}
.person .ini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--team);color:var(--team-ink);font-family:var(--f-disp);font-weight:900;font-size:13px}
.heat{display:grid;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat .r{display:grid;grid-template-columns:44px repeat(var(--n),12px);gap:3px;align-items:center}
.heat i{width:12px;height:12px;border-radius:2px;background:var(--panel-2)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--team) 30%,var(--panel-2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--team) 55%,var(--panel-2))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--team) 80%,var(--panel-2))}
.heat i[data-l="4"]{background:var(--team)}
.heat i[data-l="x"]{background:transparent;outline:1px dashed var(--line-2);outline-offset:-1px}

/* race */
.raceh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.raceh h2{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.raceh .rd{font-family:var(--f-disp);font-weight:900;color:var(--f1red);letter-spacing:.1em;font-size:13px}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:12px}
.hud>div{background:#000;border:1px solid var(--line);border-radius:4px;padding:6px 12px;display:flex;align-items:center;gap:10px}
.flag{font-family:var(--f-disp);font-weight:900;letter-spacing:.08em;min-width:150px;justify-content:center}
.flag[data-f=G]{background:#0a2a14;border-color:#1f7a3a}
.flag[data-f=SC],.flag[data-f=VSC]{background:var(--flag-sc);color:#000;border-color:var(--flag-sc)}
.flag[data-f=RED]{background:var(--flag-red);color:#fff;border-color:var(--flag-red)}
.flag[data-f=FIN]{background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/14px 14px;color:#000}
.flag[data-f=FIN] span{background:#fff;padding:0 6px}
.lapc b{font-family:var(--f-disp);font-size:24px;font-weight:900;line-height:1}
.pb{margin-left:auto;flex-wrap:wrap}
.pausebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;padding:10px 14px;border-radius:4px;background:#2a2200;border:1px solid var(--warn);color:var(--fg)}
.pausebar.red{background:#2a0503;border-color:var(--f1red)}
.pausebar b{font-family:var(--f-disp);letter-spacing:.06em}
.rg{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:16px;align-items:start}
.rside{display:grid;gap:16px;min-width:0}

.tower{position:relative;background:#000;border-radius:0 0 6px 6px}
.tw{position:absolute;left:0;right:0;height:30px;display:grid;grid-template-columns:30px 18px 5px minmax(0,1fr) 72px 66px 18px;gap:6px;align-items:center;padding:0 8px 0 6px;transition:transform .45s cubic-bezier(.3,.7,.2,1),background .3s;font-size:13px;border-bottom:1px solid #15171b}
.tw .p{font-family:var(--f-disp);font-weight:900;font-size:15px;text-align:center;background:#fff;color:#000;border-radius:2px;line-height:22px}
.tw .ch{font-size:10px;text-align:center;font-family:var(--f-mono)}
.tw .ch.up{color:var(--good)}.tw .ch.dn{color:var(--bad)}
.tw .st{height:18px;border-radius:1px}
.tw .d{display:flex;align-items:baseline;gap:6px;min-width:0}
.tw .d b{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.04em}
.tw .d small{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw .g{font-family:var(--f-mono);font-size:12px;text-align:right;color:#d8dbe0}
.tw .ty{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.tw .ty .tyre{width:18px;height:18px;border-width:2.5px;font-size:9px}
.tw .ty em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--muted);min-width:14px;text-align:right}
.tw .pt{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:right}
.tw.me{background:color-mix(in srgb,var(--team) 26%,#000)}
.tw.me .d small{color:#cfd3da}
.tw.gain{animation:gain .9s}
.tw.lose{animation:lose .9s}
@keyframes gain{0%{background:rgba(46,204,113,.45)}}
@keyframes lose{0%{background:rgba(255,77,77,.35)}}
.tw.out{opacity:.45}
.tw.out .p{background:#3a3e46;color:#fff}
.tw.pitting .g{color:var(--warn)}

.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--team);border-radius:4px;padding:12px;display:grid;gap:10px;min-width:0;position:relative}
.cc .top{display:flex;align-items:center;gap:10px}
.cc .top .pos{font-family:var(--f-disp);font-weight:900;font-size:30px;line-height:1;min-width:46px}
.cc .top .who{min-width:0}
.cc .top .who b{font-family:var(--f-disp);font-size:17px;display:block;line-height:1.1}
.cc .gaps{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cc .tyr{display:flex;align-items:center;gap:10px}
.cc .tyr .bar{flex:1}
.cc .tyr .bar i{background:var(--good)}
.cc .tyr .bar i.w2{background:var(--warn)}.cc .tyr .bar i.w3{background:var(--bad)}
.bat{display:flex;gap:3px}
.bat i{width:14px;height:8px;border-radius:1px;background:var(--panel-2)}
.bat i.on{background:#3fa9ff}
.cc .ln{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pitrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pitrow button{background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:2px;line-height:0}
.pitrow button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #fff}
.pitrow button:disabled{opacity:.3}
.pitrow .stayb{font-family:var(--f-disp);font-weight:900;font-size:10px;letter-spacing:.06em;line-height:1;padding:6px 9px;color:var(--fg)}
.tw .ty .ps{min-width:15px;height:15px;display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:9.5px;border:1px solid #6b7280;border-radius:3px;color:#d6d9de}.tw .ty .ps.z{opacity:.35}
.proj{font-size:12px;color:var(--muted)}
.eng{font-size:12px;background:#000;border-left:3px solid var(--team);padding:6px 8px;border-radius:0 3px 3px 0}
.cc.dead::after{content:attr(data-out);position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,9,11,.82);font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:.08em;border-radius:4px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}

#lapchart{display:block;width:100%;height:240px}
.feed{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);font-size:13px}
.feed li .l{font-family:var(--f-mono);font-size:11px;color:var(--dim);padding-top:2px}
.feed li.rc .t::before{content:"RACE CONTROL";display:block;font-family:var(--f-disp);font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--warn)}
.feed li.radio .t::before{content:"TEAM RADIO";display:block;font-family:var(--f-disp);font-weight:700;font-size:10px;letter-spacing:.12em;color:var(--team)}
.feed li.radio{background:color-mix(in srgb,var(--team) 8%,transparent)}

.wxbar{width:70px}
.wxbar i{background:#3fa9ff}

/* quali + grid */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.cut td{border-bottom:2px solid var(--f1red)}
.qout td{color:var(--dim)}
.plan{display:grid;gap:12px}

/* ============ standings ============ */
function standings(){
 const dp={},tp={},wins={},pods={};
 Object.keys(S.drivers).forEach(id=>{dp[id]=0;wins[id]=0;pods[id]=0});S.teams.forEach(t=>tp[t.id]=0);
 const cum={};S.teams.forEach(t=>cum[t.id]=[]);
 S.results.forEach(r=>{r.cls.forEach(e=>{dp[e.id]+=e.pts;tp[S.drivers[e.id].team]+=e.pts;if(e.pos===1&&e.st==='run')wins[e.id]++;if(e.pos<=3&&e.st==='run')pods[e.id]++});S.teams.forEach(t=>cum[t.id].push(tp[t.id]))});
 const drv=Object.keys(dp).filter(id=>S.drivers[id].team!=='ret'||dp[id]>0).sort((a,b)=>dp[b]-dp[a]||wins[b]-wins[a]).map(id=>({id,pts:dp[id],wins:wins[id],pods:pods[id]}));
 const tm=S.teams.map(t=>({id:t.id,pts:tp[t.id],wins:t.drivers.reduce((s,d)=>s+wins[d],0)})).sort((a,b)=>b.pts-a.pts||b.wins-a.wins);
 return{drv,tm,cum};
}

/* ============ weekend ============ */
function makeWeather(tr){
 const rain=rnd()<tr.rain;const w={rain,start:0,dur:0,inten:0};
 if(rain){w.start=Math.floor(tr.laps*(.2+rnd()*.6));w.dur=6+Math.floor(rnd()*14);w.inten=.5+rnd()*.5}
 w.forecast=clamp(Math.round((tr.rain+(rain?.15:-.04)+gauss()*.05)*100),2,92);
 return w;
}
function startWeekend(){
 const tr=TR(S.cal[S.cur]);
 S.wk={round:S.cur+1,track:tr.id,phase:'quali',qs:{},tow:'none',quali:null,grid:null,startTyre:{},strat:{},race:null,weather:makeWeather(tr)};
 userDrivers().forEach(d=>{qsOf(d.id);S.wk.startTyre[d.id]='M'});
 save();go('race');
}
function carPace(id){const d=S.drivers[id],t=teamById(d.team);return{perf:perfOf(t),skill:d.skill,sigma:d.sigma,rel:t.rel}}
function runQuali(){
 const wk=S.wk;const r=qualiSim(true);wk.quali=r.q;wk.grid=r.grid;const ud=userDrivers();const n=r.grid.length;const L=[];
 if(wk.tow&&wk.tow!=='none'){const rc=S.drivers[wk.tow],gv=ud.find(d=>d.id!==wk.tow);if(rc&&gv)L.push({k:'radio',t:`토우 운영: ${gv.code} → ${rc.code} 슬립스트림 제공`})}
 ud.forEach(d=>{const q=qsOf(d.id);L.push({k:'radio',t:`${d.code} 런 계획: ${{safe:'안정',std:'표준',push:'한계 공격'}[q.run]} · ${q.time==='early'?'초반 출격':'막판 출격'}${q.save?' · Q1 소프트 1세트 절약':''}`})});
 L.push(...r.notes);wk.sets={};
 ud.forEach(d=>{const q=qsOf(d.id),qq=r.q[d.id];const used=(q.save?1:2)+(qq.q2?2:0)+(qq.q3?2:0);wk.sets[d.id]={S:Math.max(0,8-used),M:3,H:2};L.push({k:'drv',w:d.code,t:qualiLine(r.grid.indexOf(d.id)+1,n)})});
 wk.qlog=L;wk.strat={};ensureStrat();wk.phase='qres';save();render();
}
/* ============ 예선 전략 ============ */
function qsOf(id){const wk=S.wk;wk.qs=wk.qs||{};if(!wk.qs[id])wk.qs[id]={run:'std',time:'late',save:false};return wk.qs[id]}
function qualiSim(rec){
 const wk=S.wk,tr=TR(wk.track);const ids=S.teams.flatMap(t=>t.drivers);const notes=[];const ud=userTeam().drivers;const tow=wk.tow||'none';
 const lap=(id,evo,ses,alive)=>{const p=carPace(id);const d=S.drivers[id];let t=tr.base-1.6+(100-p.perf)*.06+(100-p.skill)*.035-evo;
  let sg=p.sigma*.7,mis=.04;
  if(d.team!=='usr'){t+=gauss()*sg;if(rnd()<mis)t+=.5+rnd()*.9;return t}
  const q=qsOf(id);
  if(q.run==='push'){t-=.07;sg*=1.5;mis=.08}else if(q.run==='safe'){t+=.03;sg*=.8;mis=.02}
  if(q.time==='early')t+=.05;
  else{t-=.04;if(rnd()<.06){t+=.3+rnd()*.3;if(rec)notes.push({k:'rc',t:`Q${ses} 막판 황색기 — ${d.code} 마지막 랩 무효, 이전 기록으로 남음`})}}
  if(ses===1&&q.save)t+=.1;
  const mate=ud.find(x=>x!==id);
  if(tow!=='none'&&mate&&alive.has(mate)){if(tow===id)t-=.09;else if(tow===mate)t+=.04}
  t+=gauss()*sg;
  if(rnd()<mis){t+=.5+rnd()*.9;if(rec)notes.push({k:'drv',w:d.code,t:`Q${ses} ${['락업이 났어요','트랙 리밋에 걸렸어요','마지막 코너에서 뒤가 빠졌어요'][Math.floor(rnd()*3)]}, 랩 날렸어요`})}
  return t};
 const q={};const all=new Set(ids);ids.forEach(id=>q[id]={q1:lap(id,0,1,all),q2:null,q3:null});
 const o=ids.slice().sort((a,b)=>q[a].q1-q[b].q1);const c1=o.length-7;
 const s2=new Set(o.slice(0,c1));o.slice(0,c1).forEach(id=>q[id].q2=lap(id,.25,2,s2));const o2=o.slice(0,c1).sort((a,b)=>q[a].q2-q[b].q2);
 const s3=new Set(o2.slice(0,10));o2.slice(0,10).forEach(id=>q[id].q3=lap(id,.45,3,s3));const o3=o2.slice(0,10).sort((a,b)=>q[a].q3-q[b].q3);
 return{q,grid:[...o3,...o2.slice(10),...o.slice(c1)],notes};
}
function qualiPreview(){const ud=userTeam().drivers;const acc={};ud.forEach(id=>acc[id]={p:0,q3:0,q1:0,pole:0});const N=200;const n=S.teams.flatMap(t=>t.drivers).length;
 for(let k=0;k<N;k++){const r=qualiSim(false);ud.forEach(id=>{const p=r.grid.indexOf(id)+1,a=acc[id];a.p+=p;if(p<=10)a.q3++;if(p>n-7)a.q1++;if(p===1)a.pole++})}
 ud.forEach(id=>{const a=acc[id];a.p/=N;a.q3/=N;a.q1/=N;a.pole/=N});return acc}
const pick=a=>a[Math.floor(rnd()*a.length)];
function qualiLine(p,n){
 if(p===1)return pick(['폴이다!!! 랩 완벽했어요!','폴 포지션! 오늘 차 정말 좋아요, 다들 고마워요']);
 if(p<=3)return pick([`P${p}! 앞줄 근처예요, 내일 스타트로 보여줄게요`,`P${p}. 폴까지 조금 모자랐는데 레이스 페이스는 자신 있어요`]);
 if(p<=10)return pick([`Q3 P${p}. 내일은 롱런으로 올라갈게요`,`P${p}, 마지막 섹터만 잘 탔으면 더 위였어요`]);
 if(p<=n-7)return pick([`Q2 탈락, P${p}. 마지막 섹터에서 시간을 잃었어요`,`P${p}… 트래픽에 걸렸어요. 레이스에서 만회할게요`]);
 return pick(['Q1에서 떨어졌어요… 그립이 하나도 없었어요','미안해요, 오늘은 랩을 못 맞췄어요']);
}

/* ============ 결승 전략 (기본 계획) ============ */
function stintCum(tr,tm,laps){const T={};['S','M','H'].forEach(k=>{const C=COMP[k],w=tr.deg*tm/C.life;T[k]=[0,1].map(u=>{const a=[0];let s=0,we=u?.12:0;for(let n=0;n<=laps;n++){s+=C.off+C.deg*C.life*we+(we>1?(we-1)*C.life*.4:0);we+=w;a.push(s)}return a})});return T}
function stratCtx(id){const wk=S.wk,tr=TR(wk.track),ut=userTeam();const tm=1-.05*(ut.tyre||0);const sets=(wk.sets&&wk.sets[id])||{S:2,M:3,H:2};
 return{tr,tm,laps:tr.laps,sets,pit:tr.pit-.05-.12*ut.crew,cum:stintCum(tr,tm,tr.laps)}}
const tyreLife=(k,x)=>Math.floor(COMP[k].life/(x.tr.deg*x.tm));
function usedFlags(seq,sets){const c={S:0,M:0,H:0};return seq.map(k=>{c[k]++;return c[k]>sets[k]?1:0})}
function planTime(seq,laps,x){const u=usedFlags(seq,x.sets);const b=[0,...laps,x.laps];let t=0;for(let i=0;i<seq.length;i++){const n=b[i+1]-b[i];if(n<1)return Infinity;t+=x.cum[seq[i]][u[i]][n]}return t+x.pit*(seq.length-1)}
function bestFor(seq,x){const u=usedFlags(seq,x.sets),L=x.laps;const mx=seq.map((k,i)=>Math.floor((1.08-(u[i]?.12:0))*COMP[k].life/(x.tr.deg*x.tm)));let best=null;
 if(seq.length===2){for(let p=1;p<L;p++){if(p>mx[0]||L-p>mx[1])continue;const t=planTime(seq,[p],x);if(!best||t<best.t)best={seq,laps:[p],t}}}
 else for(let p=1;p<L-1&&p<=mx[0];p++)for(let q=p+1;q<L&&q-p<=mx[1];q++){if(L-q>mx[2])continue;const t=planTime(seq,[p,q],x);if(!best||t<best.t)best={seq,laps:[p,q],t}}
 return best}
function stratOptions(id){const x=stratCtx(id);const K=['S','M','H'];const seqs=[];
 K.forEach(a=>K.forEach(b=>{if(a!==b)seqs.push([a,b])}));
 K.forEach(a=>K.forEach(b=>K.forEach(c=>{if(new Set([a,b,c]).size>=2&&!(a===b&&b===c))seqs.push([a,b,c])})));
 const all=seqs.map(s=>bestFor(s,x)).filter(Boolean).sort((a,b)=>a.t-b.t);const top=all.length?all[0].t:0;all.forEach(o=>o.d=o.t-top);return all}
function setStrat(id,o){S.wk.strat=S.wk.strat||{};if(!o)return;S.wk.strat[id]={seq:o.seq.slice(),laps:o.laps.slice()};S.wk.startTyre[id]=o.seq[0]}
function ensureStrat(){const wk=S.wk;wk.strat=wk.strat||{};userDrivers().forEach(d=>{if(!wk.strat[d.id]){const o=stratOptions(d.id);setStrat(d.id,o.find(x=>x.seq[0]===wk.startTyre[d.id])||o[0])}})}
const seqHTML=seq=>seq.map(k=>tyreHTML(k)).join('<span class="arr">▸</span>');
function stratPanelHTML(d){
 const wk=S.wk,x=stratCtx(d.id),opts=stratOptions(d.id),cur=wk.strat[d.id],st=wk.startTyre[d.id];
 const top=opts.length?opts[0].t:0;const sets=x.sets;
 const forStart=opts.filter(o=>o.seq[0]===st);const seen=new Set();const list=[];
 forStart.forEach(o=>{const key=o.seq.length;if(list.length<4&&(!seen.has(o.seq.join(''))))list.push(o),seen.add(o.seq.join(''))});
 const curKey=cur.seq.join('');if(!list.some(o=>o.seq.join('')===curKey)){const c=opts.find(o=>o.seq.join('')===curKey);if(c)list.push(c)}
 const ct=planTime(cur.seq,cur.laps,x);const b=[0,...cur.laps,x.laps];const u=usedFlags(cur.seq,sets);
 const stints=cur.seq.map((k,i)=>{const n=b[i+1]-b[i];const life=Math.floor((1-(u[i]?.12:0))*COMP[k].life/(x.tr.deg*x.tm));const over=n>life;
  return `<div class="stn${over?' over':''}">${tyreHTML(k)}<span>L${b[i]+1}–${b[i+1]} · ${n}랩${u[i]?' · 중고':''}${over?' · 수명 초과':''}</span></div>`});
 const stops=cur.laps.map((l,k)=>`<div class="stopadj"><span class="lbl">박스 ${k+1}</span><button class="btn sm" data-act="stopadj" data-i="${d.id}" data-k="${k}" data-d="-1" aria-label="박스 ${k+1} 한 랩 앞당기기">−</button><b class="num">L${l}</b><button class="btn sm" data-act="stopadj" data-i="${d.id}" data-k="${k}" data-d="1" aria-label="박스 ${k+1} 한 랩 늦추기">+</button><span class="muted">→ ${COMP[cur.seq[k+1]].n}</span></div>`).join('');
 return `<div class="pc"><div class="row-flex" style="justify-content:space-between"><b style="font-family:var(--f-disp);font-size:16px">P${wk.grid.indexOf(d.id)+1} · ${d.code}</b><span class="muted" style="font-size:12px">남은 신품 S${sets.S} · M${sets.M} · H${sets.H}</span></div>
  <div><span class="lbl">출발 타이어</span><div class="pitrow" style="margin-top:4px">${['S','M','H'].map(c=>{const bo=opts.find(o=>o.seq[0]===c);return `<button data-act="stire" data-i="${d.id}" data-v="${c}" aria-pressed="${st===c}" aria-label="${COMP[c].n} 출발">${tyreHTML(c,'lg')}</button>`}).join('')}
   <span class="muted" style="font-size:12px">${COMP[st].n} 출발 최선 ${forStart[0]?(forStart[0].d<.05?'= 전체 최선':'+'+forStart[0].d.toFixed(1)+'초'):'—'}${st==='S'&&sets.S<=0?' · 신품 없음':''}</span></div></div>

  <div class="stints">${stints.join('')}</div>
  <div class="stops">${stops}<span class="muted" style="font-size:12px">이 계획: 최선 대비 ${ct-top<.05?'±0.0':'+'+(ct-top).toFixed(1)}초</span></div></div>`;

function planPit(c,R,tr){const P=c.plan;if(!P||P.off||R.wet>.3||c.tyre==='I'||c.tyre==='W'||P.idx>=P.laps.length)return aiPit(c,R,tr);

 if(L>=nx)return ty;if((f==='SC'||f==='VSC')&&nx-L<=8&&c.wear>.3)return ty;if(c.wear>1.05)return ty;return null}

 const before=qRank().slice(0,qAdv());const prev=qx.best[e.id];const imp=prev==null||e.lap<prev;if(imp){qx.best[e.id]=e.lap;qx.imp[e.id]=qx.clock}
 const rk=qRank();const pos=rk.indexOf(e.id)+1;const top=rk[0]===e.id&&imp;
 if(u){qlog('radio',`${d.code} ${fmtLap(e.lap)}${e.fresh?'':' (중고)'} · ${imp?'P'+pos:'개선 실패 · P'+pos}`,'',1);qrad(e.id,e.note==='mistake'?'mistake':e.note==='yellow'?'yellow':imp&&pos<=qAdv()?'good':'bad')}
 else if(top)qlog('rc',`${d.name} ${fmtLap(e.lap)} · 세션 최고 기록`);
 if(qx.n<3){const adv=qAdv();userDrivers().forEach(ud=>{if(ud.id===e.id||!qx.alive.includes(ud.id))return;if(before.includes(ud.id)&&!rk.slice(0,adv).includes(ud.id)){qlog('rc',`${d.code} P${pos} → ${ud.code} 탈락권(P${rk.indexOf(ud.id)+1})으로 밀림`,'',1)}})}}
function qTickTo(t){const qx=S.wk.qx;const len=QLEN[qx.n];
 if(qx.flag&&!qx.flag.shown&&t>=qx.flag.t){qx.flag.shown=true;const w=S.drivers[qx.flag.who];if(qx.flag.type==='RED'){qlog('rc',`레드 플래그 — ${w.name} 사고. 남은 시간이 부족해 세션 종료`,'',1);qx.clock=len;qx.ev.forEach(e=>{if(!e.done&&e.t>qx.flag.t){e.lap=null;if(!e.note)e.note='red'}})}else qlog('rc',`황색기 — ${w.name} 사고 구간`,'',1)}
 qx.clock=Math.max(qx.clock,Math.min(t,len));qx.ev.forEach(e=>{if(!e.done&&e.t<=qx.clock)qApply(e)});
 if(!qx.decDone&&qx.clock>=len-4&&userDrivers().some(d=>qx.alive.includes(d.id))){qx.st='dec';qx.decDone=true;qx.mc=qMC();return 'dec'}
 if(qx.clock>=len&&qx.ev.every(e=>e.done)){qEnd();return 'end'}return null}
function qMC(){const qx=S.wk.qx,len=QLEN[qx.n];const adv=qAdv();const out={};const N=160;
 userDrivers().filter(d=>qx.alive.includes(d.id)).forEach(d=>{out[d.id]={};['new','used','skip'].forEach(o=>{if(o==='new'&&qSetsLeft(d.id)<=0){out[d.id][o]=null;return}
  let ok=0,pos=0;for(let k=0;k<N;k++){const b=Object.assign({},qx.best);
   qx.alive.forEach(id=>{let fresh=true,run='std';const ud=S.drivers[id].team==='usr';
    if(id===d.id){if(o==='skip')return;fresh=o==='new';run=qx.opt[id].run}else if(ud){const f=qx.fin[id];if(f==='skip')return;fresh=f==='new';run=qx.opt[id].run}
    const r=qLap(id,qx.n,len-1.4,fresh,run);if(!(b[id]<r.lap))b[id]=r.lap});
   const p=qRank(b).indexOf(d.id)+1;pos+=p;if(p<=adv)ok++}
  out[d.id][o]={p:ok/N,pos:pos/N}})});return out}
function qRec(id){const M=S.wk.qx.mc&&S.wk.qx.mc[id];if(!M)return null;const qx=S.wk.qx;const keys=['skip','used','new'].filter(k=>M[k]);
 let best;if(qx.n===3)best=keys.slice().sort((a,b)=>M[a].pos-M[b].pos)[0];else{const top=Math.max(...keys.map(k=>M[k].p));best=keys.find(k=>M[k].p>=top-.03)}
 return best}
function qEnd(){const qx=S.wk.qx;qPause();const rk=qRank();const adv=qAdv();
 rk.forEach(id=>qx.res[id]['q'+qx.n]=qx.best[id]==null?null:qx.best[id]);
 if(qx.n<3){const out=rk.slice(adv);qx.out=[...out,...qx.out];qx.outN=qx.outN||{};out.forEach(id=>qx.outN[id]=qx.n);qx.next=rk.slice(0,adv);
  userDrivers().forEach(d=>{if(out.includes(d.id)){qlog('radio',`${d.code} Q${qx.n} 탈락 · P${rk.indexOf(d.id)+1}`,'',1);qrad(d.id,'out')}else if(qx.next.includes(d.id)){qlog('radio',`${d.code} Q${qx.n+1} 진출 · P${rk.indexOf(d.id)+1}`,'',1);if(rnd()<.6)qrad(d.id,'thru')}})}
 else{qx.final=rk;const p=userDrivers().find(d=>rk[0]===d.id);if(p)qrad(p.id,'pole');{const bp=Math.min(...userDrivers().map(d=>rk.includes(d.id)?rk.indexOf(d.id)+1:99));if(bp===1)qlog('crew','폴 포지션!!! 차고 전체가 환호합니다 🎉',CREW_N.ops,1);else if(bp<=3)qlog('crew',`P${bp}! 앞줄 싸움이다, 모두 잘했어!`,CREW_N.ops,1);else if(bp<=10)qlog('crew','Q3 마무리. 수고했어요, 내일이 진짜입니다.',CREW_N.ops,1)}userDrivers().forEach(d=>{if(rk.includes(d.id)&&rk[0]!==d.id)qlog('radio',`${d.code} Q3 P${rk.indexOf(d.id)+1}`,'',1)})}
 qx.st='end';save()}
function qNext(){const qx=S.wk.qx;if(qx.n<3){qx.n++;qx.alive=qx.next;qx.best={};qx.ev=[];qx.clock=0;qx.flag=null;qx.decDone=false;qx.mc=null;qx.imp={};qx.st='plan';qOpts();save();render();return}
 const wk=S.wk;const byT=(arr,k)=>arr.slice().sort((a,b)=>(qx.res[a][k]==null?1e9:qx.res[a][k])-(qx.res[b][k]==null?1e9:qx.res[b][k]));
 const on=qx.outN||{};
 wk.grid=[...qx.final,...byT(qx.out.filter(id=>on[id]===2),'q2'),...byT(qx.out.filter(id=>on[id]!==2),'q1')];
 wk.quali={};Object.keys(qx.res).forEach(id=>wk.quali[id]=qx.res[id]);

function castLap(R){
 if(R._castLap===R.lap)return;R._castLap=R.lap;const tn=userTeam().name,gp=TR(S.wk.track).n;
 const run=R.cars.filter(c=>c.st==='run').sort((a,b)=>a.T-b.T);if(!run.length)return;
 const P=(k,v)=>{let t=pickNR('c:'+k,CL[k]);for(const x in v||{})t=t.split('{'+x+'}').join(v[x]);return t};
 const ev=R.feed.filter(x=>x.l===R.lap);const rem=R.laps-R.lap;const lead=run[0];
 if(R.lap===1){castPush(R,CASTER,P('start',{gp,lead:nm(lead)}));castPush(R,ANALYST,P('startA',{tn}));return}
 if(rem===0){castPush(R,CASTER,P('fin',{lead:nm(lead),gp}));return}
 const f=ev.find(x=>x.k==='rc'&&/레드|세이프티|SC|VSC|리타이어|사고/.test(x.t))||ev.find(x=>/추월|박스 완료|리타이어|접촉|팀 오더/.test(x.t))||ev.find(x=>x.k==='rc');
 if(f){const t=f.t;let a,b;
  if(/레드/.test(t)){a=P('red');b=P('redA')}
  else if(/VSC/.test(t)){a=P('vsc')+' '+t;b=P('vscA')}
  else if(/재출발|들어옵니다|해제|종료/.test(t)){a=pickNR('c:rs',['세이프티카 이번 랩 들어갑니다! 재출발 준비!','그린 플래그 직전입니다! 선두가 타이밍을 쥐고 있어요!','레이스 재개 임박! 다들 타이어 데우느라 바쁩니다!']);b=pickNR('c:rsA',['재출발 첫 두 코너가 오늘 가장 위험한 순간이에요.','타이어 워밍업이 잘 된 차가 재출발에서 이득을 봅니다.','선두는 최대한 늦게 가속해서 뒤차 슬립스트림을 막으려 할 거예요.'])}
  else if(/세이프티|SC/.test(t)){a=P('sc')+' '+t;b=P('scA')}
  else if(/추월 허용/.test(t)){a=P('lost',{t});b=P('lostA')}
  else if(/추월/.test(t)){a=P('pass',{t});b=P('passA')}
  else if(/박스 완료/.test(t)){const s=(t.match(/([\d.]+)초/)||[])[1];a=P('pit',{t});b=s&&+s<2.6?P('pitFast',{s}):s&&+s>3.5?P('pitSlow',{s}):P('pitA')}
  else if(/리타이어/.test(t)){a=P('dnf',{t});b=P('dnfA')}
  else if(/팀 오더/.test(t)){a=P('ord',{t});b=P('ordA')}
  else{a=t;b=null}
  castPush(R,CASTER,a);if(b&&rnd()<.85)castPush(R,ANALYST,b);return}
 if(R.lap%2===0||rem<=3){
  const u=userCars().filter(c=>c.st==='run').map(c=>({c,p:run.indexOf(c)+1})).sort((x,y)=>x.p-y.p);
  let best=null;for(let i=1;i<Math.min(run.length,12);i++){const g=run[i].T-run[i-1].T;if(g<1.2&&(!best||g<best.g))best={i,g}}
  const opts=[];
  opts.push(()=>P('lead',{lap:R.lap,lead:nm(lead),g:run[1]?(run[1].T-lead.T).toFixed(1):'—'}));
  if(u.length){const m=u[Math.floor(rnd()*u.length)];const ahead=run[m.p-2],behind=run[m.p];
   opts.push(()=>P('my',{tn,me:cd(m.c),p:m.p,tyre:COMP[m.c.tyre]?COMP[m.c.tyre].n:'',age:m.c.age,ga:ahead?(m.c.T-ahead.T).toFixed(1):'—',d:ahead&&m.c.last&&ahead.last?Math.max(.1,ahead.last-m.c.last).toFixed(1):'0.2',bh:behind?nm(behind):'아무도 없이'}))}
  if(best)opts.push(()=>P('battle',{p:best.i,a:nm(run[best.i]),b:nm(run[best.i-1]),g:best.g.toFixed(1)}));
  const nostop=run.filter(c=>!c.stops).length;const cnt={};run.forEach(c=>cnt[c.tyre]=(cnt[c.tyre]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(R.lap>5)opts.push(()=>P('tyreTalk',{comp:COMP[top[0]]?COMP[top[0]].n:'',n:nostop}));

  if(rnd()<.65)castPush(R,ANALYST,rnd()<.25?P('remA',{rem}):P('fill'))}
}

 const ex=c.map(x=>Math.exp(x.s/3));const tot=ex.reduce((a,b)=>a+b,0);let pct=ex.map(v=>v/tot*100);

 return{c:c.map((x,i)=>({id:x.id,why:x.why,pct:pct[i]})),voted:null,done:false,votes:Math.round((40000+rnd()*90000)*(.6+S.fans/120))}}

function gapText(c,order,idx,tr){
 if(c.st!=='run')return c.reason?'OUT':'OUT';
 if(c.pitNow===2)return 'PIT';
 if(idx===0)return S.wk.race.lap?'LEADER':'—';
 const ref=S.ui.gapMode==='int'?order[idx-1]:order[0];const g=c.T-ref.T;const lp=tr.base*1.02;
 if(S.ui.gapMode==='leader'&&g>lp)return '+'+Math.floor(g/lp)+' LAP';
 return '+'+g.toFixed(S.ui.gapMode==='int'?1:3);
}
function projRejoin(c,R,tr){
 const loss=pitLoss(R,tr)-2.5+2.45-.12*c.crew;const T=c.T+loss;
 const others=R.cars.filter(x=>x.st==='run'&&x!==c).sort((a,b)=>a.T-b.T);
 let p=1;let ahead=null,behind=null;for(const o of others){if(o.T<T){p++;ahead=o}else{behind=behind||o}}
 return{p,ahead,behind,T,loss};
}
function engineerLine(c,R,tr){
 const rem=R.laps-R.lap;const f=R.flag&&R.flag.type;
 if(c.st!=='run')return '';
 if(R.red)return '레드 플래그 · 타이어 무상 교체 가능';
 if(needsSecond(c)&&rem<=12)return `규정: 두 번째 컴파운드 필요 · 남은 ${rem}랩`;
 if(f==='SC')return '세이프티카 · 피트 손실이 절반 수준입니다';
 if(f==='VSC')return 'VSC · 피트 손실 약 '+Math.round(pitLoss(R,tr))+'초';
 if(R.wet>.4&&c.tyre!=='I'&&c.tyre!=='W')return '슬릭으로는 위험합니다 · 인터 권장';
 if(R.wet<.25&&(c.tyre==='I'||c.tyre==='W')&&R.lap>2)return '라인이 말랐습니다 · 슬릭 타이밍';

 if(c.wear>.8)return '피트 창 열림';

 return c.tyre==='I'||c.tyre==='W'?'젖은 노면 운영 중':`현재 마모로 약 ${Math.max(0,est)}랩 뒤 피트 창`;

 const w=chartW||cv.clientWidth,h=240;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

 ctx.font='10px "JetBrains Mono",monospace';ctx.fillStyle='#5f6672';ctx.strokeStyle='#1f232a';ctx.lineWidth=1;
 [1,5,10,15,20,n].forEach(p=>{ctx.beginPath();ctx.moveTo(pl,Y(p));ctx.lineTo(w-pr,Y(p));ctx.stroke();ctx.fillText('P'+p,0,Y(p)+3)});
 for(let l=0;l<=L;l+=10){ctx.fillText(l,X(l)-4,h-4)}
 if(R.lap){ctx.strokeStyle='#343944';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(X(R.lap),pt);ctx.lineTo(X(R.lap),h-pb);ctx.stroke();ctx.setLineDash([])}

 const paths=series.slice().sort((a,b)=>a.bold-b.bold).map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="${s.bold?3:1.5}" stroke-opacity="${s.bold?1:.55}" points="${s.vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${s.bold?`<circle cx="${X(s.vals.length-1)}" cy="${Y(s.vals[s.vals.length-1])}" r="4" fill="${s.color}"/>`:''}`).join('');
 const lab=ends.map(e=>`<text x="${X(e.s.vals.length-1)+8}" y="${e.ly+4}" fill="${e.s.bold?'var(--fg)':'var(--muted)'}" font-size="11" font-weight="${e.s.bold?700:400}" font-family="Titillium Web, sans-serif">${esc(e.s.name)} ${e.s.vals[e.s.vals.length-1]}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="컨스트럭터 누적 포인트">${g}${paths}${lab}</svg>`;
}
function viewInsights(m){
 const st=standings();
 if(!S.results.length){m.innerHTML=`<div class="card"><div class="body muted">첫 그랑프리를 마치면 순위 그래프와 표가 채워집니다.</div></div>`+standTables(st);return}
 const labels=S.results.map(r=>'R'+r.round);
 const series=st.tm.slice(0,8).concat(st.tm.slice(8).filter(x=>x.id==='usr')).map(x=>{const t=teamById(x.id);return{name:t.name,color:t.color,vals:st.cum[x.id],bold:!!t.user}});
 m.innerHTML=`<div class="ins"><div class="card wide chart"><header>컨스트럭터 누적 포인트</header><div class="body">${lineChart(series,labels)}</div></div></div>`+standTables(st);
}
function standTables(st){
 return `<div class="ins" style="margin-top:16px"><div class="card"><header>드라이버 챔피언십</header><div class="tscroll"><table><thead><tr><th>P</th><th>드라이버</th><th>W</th><th>PTS</th></tr></thead><tbody>${st.drv.map((x,i)=>{const d=S.drivers[x.id],t=teamById(d.team);return `<tr class="${t.user?'me':''}"><td class="num">${i+1}</td><td><span class="stripe" style="background:${t.color}"></span><b style="font-family:var(--f-disp)">${d.code}</b> <span class="muted">${esc(d.name)}</span></td><td class="num">${x.wins||''}</td><td class="num">${x.pts}</td></tr>`}).join('')}</tbody></table></div></div>
 <div class="card"><header>컨스트럭터 챔피언십</header><div class="tscroll"><table><thead><tr><th>P</th><th>팀</th><th>성능</th><th>PTS</th></tr></thead><tbody>${st.tm.map((x,i)=>{const t=teamById(x.id);return `<tr class="${t.user?'me':''}"><td class="num">${i+1}</td><td><span class="stripe" style="background:${t.color}"></span>${esc(t.name)}</td><td class="num muted">${perfOf(t).toFixed(1)}</td><td class="num">${x.pts}</td></tr>`}).join('')}</tbody></table></div></div></div>`;
}
let resetArm=false;
function viewSettings(m){
 m.innerHTML=`<div class="ins"><div class="card"><header>세이브 코드</header><div class="body" style="display:grid;gap:10px">
  <p class="muted" style="margin:0;font-size:13px">진행 상황은 이 브라우저에 자동 저장됩니다. 다른 기기로 옮기려면 코드를 복사해 그쪽 설정 탭에 붙여 넣으세요.</p>
  <textarea id="exp" readonly aria-label="세이브 코드">${esc(encodeSave())}</textarea>
  <div class="row-flex"><button class="btn" data-act="copy">코드 복사</button><span id="copied" class="muted" style="font-size:12px"></span></div></div></div>
  <div class="card"><header>불러오기 · 초기화</header><div class="body" style="display:grid;gap:10px">
  <textarea id="imp" placeholder="세이브 코드를 붙여 넣으세요" aria-label="불러올 세이브 코드"></textarea>
  <div class="row-flex"><button class="btn primary" data-act="import">불러오기</button><span id="imperr" class="warn"></span></div>
  <hr style="border:0;border-top:1px solid var(--line);width:100%">
  <div class="row-flex"><button class="btn" data-act="reset" style="${resetArm?'background:var(--f1red);border-color:var(--f1red);color:#fff':''}">${resetArm?'한 번 더 누르면 팀이 삭제됩니다':'팀 삭제하고 새로 창단'}</button></div></div></div></div>`;
}
function encodeSave(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return ''}}

/* ============ events ============ */
document.addEventListener('mouseover',e=>{const p=e.target.closest&&e.target.closest('[data-part]');const car=document.querySelector('.car');if(!car)return;car.querySelectorAll('.part').forEach(g=>g.classList.toggle('hv',!!p&&g.dataset.part===p.dataset.part))});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,i=b.dataset.i;
 if(!S){
  if(a==='swatch'){D.color=v;render()}
  else if(a==='alloc'){const k=b.dataset.k,mx={aero:12,power:12,rel:8,crew:5}[k];D.alloc[k]=clamp(D.alloc[k]+(+b.dataset.d),0,mx);render()}
  else if(a==='pu'){D.pu=v;render()}
  else if(a==='arch'){D.drivers[+i].arch=v;render()}
  else if(a==='reroll'){rollProspects(D);render()}
  else if(a==='sign'){const k=+i,p=prospect(v);if(!p)return;const other=D.drivers[1-k];if(other.pid===p.id){other.pid=null;other.name='Driver '+(2-k);other.code='DRV'}
   const taken=new Set(RIVALS.flatMap(r=>r.dr.map(x=>x[2])));taken.add(+D.drivers[1-k].num);let n=p.num;while(taken.has(n))n=n%99+1;
   D.drivers[k]={name:p.name,code:p.code,num:n,arch:D.drivers[k].arch||'rook',pid:p.id};render()}
  else if(a==='release'){const k=+i;D.drivers[k]={name:'',code:'',num:D.drivers[k].num,arch:'rook'};render()}
  else if(a==='len'){D.len=+v;render()}
  else if(a==='create')createTeam();
  return;
 }
 const R=S.wk&&S.wk.race;const car=i&&R?R.cars.find(c=>c.id===i):null;
 const held=!!(R&&!R.done&&R.lap>0&&!timer&&(R.pause||R.ask||R.red||resumeT));
 switch(a){
  case 'tab':go(v);break;
  case 'weekend':startWeekend();break;
  case 'qs':{const q=qsOf(i);const k=b.dataset.k;q[k]=k==='save'?v==='true':v;save();render();break}
  case 'qtow':S.wk.tow=v;save();render();break;
  case 'stratpick':{const o=stratOptions(i).find(x=>x.seq.join('')===v);if(o)setStrat(i,o);save();render();break}
  case 'stopadj':{const p=S.wk.strat[i];const k=+b.dataset.k,L=TR(S.wk.track).laps;const lo=k?p.laps[k-1]+1:1,hi=k<p.laps.length-1?p.laps[k+1]-1:L-1;p.laps[k]=clamp(p.laps[k]+(+b.dataset.d),lo,hi);save();render();break}
  case 'planadj':{const P=car.plan;if(!P||P.idx>=P.laps.length)break;const lo=Math.max(R.lap+1,P.idx?1:1),hi=P.idx<P.laps.length-1?P.laps[P.idx+1]-1:R.laps-1;P.laps[P.idx]=clamp(P.laps[P.idx]+(+b.dataset.d),lo,hi);if(car.planPend){car.pitReq=null;car.planPend=false}updateRace();break}
  case 'renew':case 'leave':case 'signc':case 'summerdone':summerAct(a,b);break;
  case 'runq':runQuali();break;
  case 'qopt':S.wk.qx.opt[i][b.dataset.k]=v;save();render();break;
  case 'qstart':qStart();break;
  case 'qplay':qPlay();break;
  case 'qpause':qPause();qUpdate();save();break;
  case 'qspeed':S.ui.speed=+v;save();$$('[data-act="qspeed"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));if(qTimer)qPlay();break;
  case 'qskip':qSkip();break;
  case 'qfin':S.wk.qx.fin[i]=v;save();qUpdate();break;
  case 'qconfirm':qConfirm();break;
  case 'qnext':qNext();break;
  case 'tord':teamOrder(v);break;
  case 'dmsg':{const sel=b.parentElement.querySelector('select');if(car&&sel)dirMsg(car,sel.value);break}
  case 'ans':answer(v);break;
  case 'stayout':if(car&&car.st==='run'&&!car.auto)dirMsg(car,'stay');break;
  case 'stire':{S.wk.startTyre[i]=v;const o=stratOptions(i).find(x=>x.seq[0]===v);if(o)setStrat(i,o);save();render();break}
  case 'start':initRace();render();break;
  case 'play':play();break;
  case 'pause':pause();break;
  case 'speed':S.ui.speed=+v;save();$$('[data-act="speed"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));if(timer)play();break;
  case 'step':if(R&&!R.done&&!R.red){pause();R.pause=null;stepLap();if(R.done)render();else updateRace()}break;
  case 'simend':simToEnd();break;
  case 'mode':car.mode=v;updateRace();break;
  case 'en':car.en=v;updateRace();break;
  case 'pit':if(car.st!=='run'||car.auto)break;car.planPend=false;car.pitReq=car.pitReq===v?null:v;if(car.pitReq&&car.pitReq===car.tyre&&car.wear<.05)car.pitReq=null;
   if(car.pitReq){const dry=['S','M','H'];if(dry.includes(v)&&!car.used.includes('I')&&!car.used.includes('W')&&car.used.every(x=>x===v)&&R.laps-R.lap<15)log('radio',`${cd(car)} 엔지니어: ${COMP[v].n}만 쓰면 두 컴파운드 규정 위반입니다. 다른 컴파운드를 권합니다.`);else log('radio',`${cd(car)} 이번 랩 박스, ${COMP[v].n} 준비`)}
   updateRace();break;
  case 'pitcancel':if(car.planPend&&car.plan&&car.plan.idx<car.plan.laps.length){car.plan.laps[car.plan.idx]=Math.min(R.laps-1,R.lap+2);log('radio',`${cd(car)} 계획 박스 연기 → L${car.plan.laps[car.plan.idx]}`)}car.pitReq=null;car.planPend=false;updateRace();break;
  case 'gapmode':S.ui.gapMode=v;$$('[data-act="gapmode"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));updateRace();break;
  case 'redty':R.redTyre=R.redTyre||{};R.redTyre[i]=v;updateRace();break;
  case 'redgo':applyRed();updateRace();break;
  case 'next':nextRound();break;
  case 'newseason':newSeason();break;
  case 'merge':merge(v);break;
  case 'dotd':dotdVote(v);break;
  case 'snstab':S.ui.snsTab=v;save();render();break;
  case 'resumenow':clearResume();play();break;
  case 'resumehold':clearResume();updateRace();break;
  case 'copy':{const t=$('#exp').value;const done=()=>{$('#copied').textContent='복사했습니다'};try{navigator.clipboard.writeText(t).then(done,()=>{$('#exp').select();$('#copied').textContent='선택했습니다. Ctrl+C로 복사하세요'})}catch(err){$('#exp').select()}break}
  case 'import':{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(!o||!o.teams)throw 0;pause();S=o;save();go('overview')}catch(err){$('#imperr').textContent='코드를 읽지 못했습니다. 전체를 빠짐없이 붙여 넣었는지 확인하세요.'}break}
  case 'reset':if(!resetArm){resetArm=true;render()}else{resetArm=false;pause();try{localStorage.removeItem(KEY)}catch(err){}S=null;D=defaultDraft();rollProspects(D);render()}break;
 }
 if(held&&S.ui.autoResume!==false){const ms={ans:900,redgo:1200,stayout:2200,pit:2200,pitcancel:1800,dmsg:1600,tord:1600,planadj:2200}[a];if(ms)armResume(ms)}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='autopause'){S.ui.autoPause=t.checked;save()}
 if(t.id==='autoresume'){S.ui.autoResume=t.checked;save()}
 if(t.dataset&&t.dataset.act2==='auto'){const c=S.wk.race.cars.find(x=>x.id===t.dataset.i);c.auto=t.checked;if(c.auto)c.pitReq=null;updateRace()}
});
document.addEventListener('input',e=>{
 if(S)return;const t=e.target;const id=t.id;
 if(id==='f-owner')D.owner=t.value;else if(id==='f-name')D.name=t.value;else if(id==='f-desc')D.desc=t.value;
 else if(id==='f-color'){D.color=t.value;applyTheme()}
 else if(id.startsWith('d-name-')){const k=+id.slice(7);D.drivers[k].name=t.value;D.drivers[k].code=codeFrom(t.value)}
 else if(id.startsWith('d-code-'))D.drivers[+id.slice(7)].code=t.value.toUpperCase();
 else if(id.startsWith('d-num-'))D.drivers[+id.slice(6)].num=+t.value;
 else return;
 const mut=['f-color','f-name','f-owner'].includes(id)||id.startsWith('d-name-')||id.startsWith('d-num-');
 if(mut){const pos=t.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}}}

});
window.addEventListener('resize',()=>{if($('#lapchart'))sizeChart()});

/* ============ boot ============ */
load();
if(S&&S.wk&&S.wk.race&&!S.wk.race.done&&S.ui)S.wk.race.pause=S.wk.race.pause||null;
if(!S){D=defaultDraft();rollProspects(D)}
else{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.ui.tab=h}
render();
</script>
</body>
</html>
